[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,README.md,RULES_MAPPING.md,assets/FONT_LICENSE.txt,assets/tribunal.wav,tools/*"
export_path="../dicebound-builds/web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
